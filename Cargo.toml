[package]
name = "rustty"
version = "2.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.37.0", features = ["full"] }
russh = "0.43.0"
russh-keys = "0.43.0"
serialport = "4.3.0"
vte = "0.13.0"
aes-gcm = "0.10.3"
rand = "0.8.5"
uuid = { version = "1.8.0", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0.1"
async-trait = "0.1.80"
zeroize = { version = "1.8", features = ["std"] }
keyring = "4.1.6"
hex = "0.4.3"
image = "0.25.10"
secrecy = { version = "0.8.0", features = ["serde"] }
self_update = { version = "0.41", features = ["rustls"] }
self-replace = "1.5.0"
reqwest = { version = "0.13.4", features = ["blocking", "rustls"] }
tokio-util = { version = "0.7.19", features = ["io"] }
wry = "0.44"
winit = "0.29.15"
tokio-tungstenite = "0.24"
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52.0", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
] }
windows = { version = "0.58.0", features = [
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }



[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
image = "0.25.10"
winres = "0.1.12"
