[package]
name = "rustty"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { version = "0.12.1", features = ["canvas", "tokio", "svg", "image"] }
iced_aw = { version = "0.9.0", default-features = false, features = ["card", "context_menu", "modal", "color_picker", "date_picker"] }
tokio = { version = "1.37.0", features = ["full"] }
russh = "0.43.0"
russh-keys = "0.43.0"
serialport = "4.3.0"
vte = "0.13.0"
aes-gcm = "0.10.3"
rand = "0.8.5"
uuid = { version = "1.8.0", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0.1"
async-trait = "0.1.80"
zeroize = { version = "1.8", features = ["std"] }
resvg = "0.36.0"
usvg = "0.36.0"
keyring = "4.1.6"
hex = "0.4.3"
image = "0.25.10"
secrecy = { version = "0.8.0", features = ["serde"] }
pulldown-cmark = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52.0", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
] }



[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
image = "0.25.10"
winres = "0.1.12"
